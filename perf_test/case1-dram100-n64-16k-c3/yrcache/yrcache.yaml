#enable_async_loading: true
log_level: 3
log_file_path: ''
metric_level: 2
nr_workers: 16
chunk_size: 256
exporter_port: 39098
restore_last_chunk_on_full_hit: true
enable_async_loading: true
cpu_cache_config:
  max_cpu_memory_size: 112
  reserve_memory_size: 12
  enable_cpu_memory_cache: true
  cache_policy:
    get_policy: 1
    return_policy: 1
    set_policy: 2
    lookup_policy: 1
local_disk_cache_config:
  enable_local_disk_cache: true
  use_direct_io: true
  file_count_per_disk: 10
  gc_op_space_cap_pct: 20
  checkpoint_interval_ms: 2000
  local_disks:
  - /test/data_disk_1/case1-yrcache:100
  cache_policy:
    get_policy: 1
    return_policy: 1
    set_policy: 2
    lookup_policy: 1
shared_storage_cache_config:
  enable_shared_storage_cache: false
  redis_mode: sentinel
  redis_host: 10.10.30.191
  redis_port: 6379
  redis_sentinel_master_name: mymaster
  redis_sentinel_nodes: 
    - host: "10.10.30.191"
      port: 26379
    - host: "10.10.30.192"
      port: 26379
    - host: "10.10.30.193"
      port: 26379
  redis_password: 'REPLACE_REDIS_PASSWORD'
  redis_pool_size: 8
  redis_wait_timeout_ms: 5000
  redis_connect_timeout_ms: 1000
  redis_socket_timeout_ms: 3000
  file_count: 100
  shared_storage_heartbeat_s: 300
    #  circuit_breaker_business_timeout_ms: 5000
    #circuit_breaker_heartbeat_timeout_ms: 24000
  filesystem_probe_strategy: 0
    #  g35_cluster_id: 'contextbox'
    #  g35_osd_ids: [101,102,103,104,105,106,201,202,203,204,205,206,301,302,303,304,305,306]
  g35_normal_probe_interval_s: 60
  g35_degraded_probe_interval_s: 3
  g35_recovery_success_confirmations: 3
  mount_path: /mnt/yrfs/kuanheng
  data_sub_path: node157
  min_shared_storage_free_gb: 100
  redis_pin_key: share_fs_gc_zset
  cache_policy:
    get_policy: 1
    return_policy: 1
    set_policy: 2
    lookup_policy: 1
zmq_tp_lookup_config:
  rpc_host: 127.0.0.1
  rpc_port: 5555
  pub_port: 5556
  router_port: 5557
  use_tcp: true
zmq_config:
  proxy_zmq_address: tcp://127.0.0.1:8500
  decode_zmq_port: 8702
  yrcache_lookup_max_retries: 10
  yrcache_lookup_retry_interval: 0.01
  sender_threads: 20
  receiver_handle_threads: 20
  queue_max_size: 100000
look_up_retry_config:
  lookup_timeout_ms: 1000
  max_retries: 10
  retry_interval_ms: 100
